<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Window Fetch Protection Shim for Polyfills in Sandboxed Environments -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          if (nativeFetch) {
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!desc || (!desc.set && !desc.writable)) {
              var _fetch = nativeFetch.bind(window);
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _fetch;
                },
                set: function(newFetch) {
                  if (typeof newFetch === 'function') {
                    _fetch = newFetch;
                  }
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          console.warn('Fetch setter initialization warning:', e);
        }
      })();
    </script>
    
    <!-- Primary SEO Meta Tags -->
    <title>Popcorn — Watch Trailers, Discover Movies & TV Shows</title>
    <meta name="title" content="Popcorn — Watch Trailers, Discover Movies & TV Shows" />
    <meta name="description" content="Discover top trending movies, binge-worthy TV series, 4K official trailers, and TMDB user ratings with Popcorn — the ultimate frosted glass cinema streaming experience." />
    <meta name="keywords" content="Popcorn, movies, cinema, TV shows, watch trailers, TMDB ratings, stream movies, top 10 movies, film discovery, cinema app, PWA movies" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="theme-color" content="#050508" />

    <!-- Search Engine Schema.org JSON-LD -->

        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "Popcorn",
          "applicationCategory": "EntertainmentApplication",
          "genre": "Movies & TV",

          "url": ["/?tab=home", "/?tab=browse&type=movie", "/?tab=browse&type=tv", "/?tab=search", "/?tab=library"]
        }
      ]
    </script>
