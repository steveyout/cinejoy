<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="cjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="playWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="ringGlowBig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glowBig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#f43f5e" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#fbbf24" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#cjBg)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#ringGlowBig)" stroke-width="8" opacity="0.6" />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#cjGrad)" opacity="0.16" />

  <!-- Main Cinejoy Badge Frame -->
  <rect x="112" y="112" width="288" height="288" rx="88" fill="url(#cjGrad)" filter="url(#glowBig)" />

  <!-- Glass Inner Highlight Curve -->
  <path d="M 136 136 C 180 120, 332 120, 376 136 C 384 192, 368 256, 136 256 Z" fill="#ffffff" opacity="0.22" />

  <!-- Film Strip / Aperture Indicators -->
  <circle cx="152" cy="160" r="12" fill="#ffffff" opacity="0.8" />
  <circle cx="152" cy="352" r="12" fill="#ffffff" opacity="0.8" />
  <circle cx="360" cy="160" r="12" fill="#ffffff" opacity="0.8" />
  <circle cx="360" cy="352" r="12" fill="#ffffff" opacity="0.8" />

  <!-- Central High-Impact Play Icon -->
  <path d="M 216 180 C 216 169.5, 227.5 163, 236.5 168.8 L 332.5 236.8 C 340.5 242.5, 340.5 253.5, 332.5 259.2 L 236.5 327.2 C 227.5 333, 216 326.5, 216 316 Z" fill="url(#playWhite)" />

  <!-- Cinema Sparkles -->
  <path d="M 384 80 L 396 108 L 424 112 L 401 132 L 409 160 L 384 142 L 358 160 L 366 132 L 344 112 L 372 108 Z" fill="#fbbf24" />
  <circle cx="112" cy="112" r="14" fill="#fef08a" opacity="0.9" />
</svg>
