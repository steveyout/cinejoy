    <circle cx="32" cy="14" r="7.5" fill="url(#popcornKernel)" />
    <circle cx="42" cy="18" r="6" fill="url(#popcornKernel)" />
    <circle cx="16" cy="24" r="5" fill="url(#popcornKernel)" />
