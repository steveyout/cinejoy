<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial / Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <linearGradient id="cinejoyAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.35"/>
    </filter>

    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Dark Cinema Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#ringGlow)" stroke-width="2" filter="url(#shadowDepth)"/>

  <!-- Inner Ambient Glow Circle -->
  <circle cx="32" cy="32" r="23" fill="url(#cinejoyAura)" opacity="0.18" />

  <!-- Main Cinejoy Rounded Cinema Badge Frame -->
  <rect x="14" y="14" width="36" height="36" rx="11" fill="url(#cinejoyAura)" filter="url(#iconGlow)" />

  <!-- Glass Inner Highlight Curve -->
  <path d="M 17 17 C 22 15, 42 15, 47 17 C 48 24, 46 32, 17 32 Z" fill="#ffffff" opacity="0.22" />

  <!-- Film Strip Perforations / Modern Aperture Dots -->
  <circle cx="18.5" cy="20" r="1.5" fill="#ffffff" opacity="0.75" />
  <circle cx="18.5" cy="44" r="1.5" fill="#ffffff" opacity="0.75" />
  <circle cx="45.5" cy="20" r="1.5" fill="#ffffff" opacity="0.75" />
  <circle cx="45.5" cy="44" r="1.5" fill="#ffffff" opacity="0.75" />

  <!-- Central High-Impact Play Icon (Joy Stream) -->
  <path d="M 27 22.5 C 27 21.2, 28.4 20.4, 29.5 21.1 L 41.5 29.6 C 42.5 30.3, 42.5 31.7, 41.5 32.4 L 29.5 40.9 C 28.4 41.6, 27 40.8, 27 39.5 Z" fill="url(#playGrad)" filter="url(#shadowDepth)" />

  <!-- Cinema Sparkle / Joy Star -->
  <path d="M 48 10 L 49.5 13.5 L 53 14 L 50.2 16.5 L 51.2 20 L 48 17.8 L 44.8 20 L 45.8 16.5 L 43 14 L 46.5 13.5 Z" fill="#fbbf24" opacity="0.95" />
  <circle cx="14" cy="14" r="1.8" fill="#fef08a" opacity="0.85" />
</svg>
