<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="popcornGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="popcornGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="butterGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark circular background with subtle rim border -->
  <circle cx="32" cy="32" r="30" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow)"/>

  <!-- Popcorn Kernels (Top Cluster) -->
  <g filter="url(#glow)">
    <!-- Back Popcorn puffs -->
    <circle cx="23" cy="18" r="6" fill="url(#popcornGrad1)" />
    <circle cx="32" cy="15" r="7" fill="url(#popcornGrad2)" />
    <circle cx="41" cy="18" r="6" fill="url(#popcornGrad1)" />
    <circle cx="16" cy="23" r="5.5" fill="url(#popcornGrad2)" />
    <circle cx="48" cy="23" r="5.5" fill="url(#popcornGrad2)" />

    <!-- Center fluffy kernels with golden buttery core -->
    <circle cx="26" cy="22" r="6" fill="url(#butterGlow)" />
    <circle cx="38" cy="22" r="6" fill="url(#butterGlow)" />
    <circle cx="32" cy="24" r="6.5" fill="url(#popcornGrad2)" />

    <!-- Kernel details/crevices -->
    <path d="M 23 17 Q 26 19 29 18" stroke="#ca8a04" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 35 17 Q 38 19 41 17" stroke="#ca8a04" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 30 23 Q 32 25 34 23" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Cinema Bucket Base -->
  <g filter="url(#glow)">
    <!-- Bucket Outer Shape (Trapezoid with rounded bottom) -->
    <path d="M 16 28 L 20 54 Q 21 57 24 57 L 40 57 Q 43 57 44 54 L 48 28 Z" fill="url(#bucketGrad)" />
    
    <!-- White Classic Cinema Stripes -->
    <!-- Center stripe -->
    <path d="M 30 28 L 30.5 57 L 33.5 57 L 34 28 Z" fill="url(#stripeGrad)" />
    <!-- Left stripe -->
    <path d="M 22.5 28 L 25 56.5 L 27.5 56.5 L 25.5 28 Z" fill="url(#stripeGrad)" />
    <!-- Right stripe -->
    <path d="M 38.5 28 L 36.5 56.5 L 39 56.5 L 41.5 28 Z" fill="url(#stripeGrad)" />

    <!-- Top Rim of Bucket -->
    <rect x="14" y="27" width="36" height="3.5" rx="1.75" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="15" y="28" width="34" height="1.5" rx="0.75" fill="#e11d48" opacity="0.8"/>
  </g>

  <!-- Cinema Sparkles / Golden Star -->
  <path d="M 48 10 L 49.2 13.5 L 53 14 L 49.8 16.5 L 51 20 L 48 17.5 L 45 20 L 46.2 16.5 L 43 14 L 46.8 13.5 Z" fill="#fbbf24" opacity="0.9"/>
  <circle cx="14" cy="14" r="1.5" fill="#fef08a" opacity="0.8"/>
</svg>
